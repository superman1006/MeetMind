# MeetMind 前端站点配置：托管静态页 + 把 /api、/events 反代到后端 runtime 容器。
# 同源（同一个 80 端口）对外，浏览器没有跨域问题，SSE 也能直通。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源 gzip，前端 bundle 体积友好。
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 单页应用：除静态文件外的路径一律回退到 index.html（交给前端路由）。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JSON-RPC：一问一答，转发到 runtime:3002。
    # 注意 proxy_pass 不带末尾斜杠，保持原始路径 /api 完整透传。
    location /api {
        proxy_pass http://runtime:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 事件流（长连）：必须关闭缓冲，否则 Nginx 会把消息攒着、不实时下发。
    location /events {
        proxy_pass http://runtime:3002;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection '';        # 清掉 Connection 头，保持长连
        proxy_buffering off;                   # 关键：关闭响应缓冲，逐帧下发
        proxy_cache off;
        proxy_read_timeout 24h;                # 长连不要被读超时掐断
        chunked_transfer_encoding off;
    }
}
